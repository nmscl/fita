  claro:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',

 function pref(){try{const v=localStorage.getItem(K);return ORDEM.includes(v)?v:'auto';}catch(e){return 'auto';}}

 }

  b.innerHTML='<svg viewBox="0 0 24 24" class="cm-tema-ico" aria-hidden="true" focusable="false">'+ICONES[p]+'</svg><span class="cm-tema-rot">'+NOMES[p]+'</span>';

/* O administrador acede a todas as provas, tal como na gestão: a password dele vale nos leitores e no quadro. */
window.cmAdminComPassword=(estado,password)=>!!password&&(estado?.utilizadores||[]).some(c=>(c.tipo==='administrador'||(c.user==='admin'&&!c.tipo))&&c.pass===password);

window.cmAnoEquivalente=ano=>{const m=String(ano??'').match(/\(\s*(\d{1,2})\s*[^)]*\)/),n=m?Number(m[1]):NaN;return n>=1&&n<=12?n:null;};

window.CMRelogio=(()=>{

   const t0=Date.now(),r=await fetch(location.href,{method:'HEAD',cache:'no-store'}),t1=Date.now(),servidor=Date.parse(r.headers.get('date')||'');

   return seg;
  }catch(e){return null;}
 }

})();

const CMPartilhaResultados=(()=>{

function escutarDadosAutomaticosCM(referencia,receber,falhar){

    function ligar(){
        if(parado || ativo)return;

        try{
            desligar=referencia.onSnapshot({includeMetadataChanges:true},snapshot=>{
                if(parado || atual!==epoca)return;

                    erroTimer=setTimeout(()=>{erroTimer=null;if(!document.hidden)ligar();},atraso);
                    atraso=Math.min(30000,atraso*2);

            });
        }catch(error){ativo=false;falhar?.(error);erroTimer=setTimeout(ligar,atraso);atraso=Math.min(30000,atraso*2);}
    }
    function revalidar(forcar=false){
        if(parado || document.hidden || navigator.onLine===false)return Promise.resolve();
        ligar();

        ultimoPedido=agora;const inicio=geracao;
        leitura=Promise.resolve().then(()=>referencia.get({source:'server'})).then(snapshot=>{
            // Um get iniciado antes de uma atualização nunca deve sobrepor-se a ela.
            if(!parado && geracao===inicio)entregar(snapshot);

 :root{color-scheme:light;--visual-ink:#263759;--visual-muted:#75829b;--visual-bg:#f4f6fc;--visual-green:#5b4df5;--visual-soft:#efedff;--visual-line:#dfe4f2;--visual-radius:16px;--font-sans:'Segoe UI',Arial,sans-serif;--font-heading:'Segoe UI',Arial,sans-serif;--font-mono:Consolas,monospace;--brand-primary:#263759;--brand-accent:#5b4df5;--brand-accent-hover:#056749;--brand-accent-light:#efedff;--bg-body:#f4f6fc;--surface:#fff;--surface-muted:#f6f7fc;--border:#dfe4f2;--border-light:#e9efec;--text-heading:#263759;--text-body:#465b7a;--text-muted:#75829b;--success:#5b4df5;--success-light:#efedff;--success-border:#a9d7bd;--danger:#b63843;--danger-light:#fff0f1;--danger-border:#efc0c6;--warning:#8c5a08;--warning-light:#fff6e1;--warning-border:#eed9a3;--info:#17668c;--info-light:#eaf4fa;--radius-sm:9px;--radius-md:14px;--radius-lg:18px;--shadow-sm:0 2px 8px #173b4006;--shadow-md:0 8px 24px #173b4009;--shadow-lg:0 20px 60px #173b4018;--mint:#5b4df5;--muted:#75829b;--line:#dfe4f2}
 html{scroll-padding-top:120px;scroll-behavior:smooth}
 body.cm-visual{--text:#263759;--text-subtle:#75829b;--bg:#f4f6fc;--panel:#fff;--panel-deep:#f5f6fc;--purple:#476a95;--gold:#966c12;--line-strong:#b8cfc0;--surface-subtle:#f5f6fc;--surface-hover:#eef6f0;--brand-gradient:linear-gradient(135deg,#5b4df5,#116f55);--success-gradient:linear-gradient(135deg,#5b4df5,#116f55)}
 body.cm-visual{background:var(--visual-bg)!important;background-image:none!important;color:var(--visual-ink)!important;font-family:var(--font-sans)!important;-webkit-user-select:text!important;user-select:text!important;line-height:1.55}
 body.cm-visual :is(button,input,select,textarea){font-family:var(--font-sans)}
 body.cm-visual :is(button,a,label,input,select,textarea,summary){-webkit-tap-highlight-color:transparent}
 body.cm-visual :is(button,.btn,summary,a,input,select,textarea):focus-visible{outline:3px solid #149a72!important;outline-offset:3px;box-shadow:none!important}
 body.cm-visual [hidden]{display:none!important}
 body.cm-visual :is(input,select,textarea):not([type=checkbox]):not([type=radio]):not([type=color]):not([type=file]):not([type=range]){color:var(--visual-ink)!important;background:#fff!important;border:1px solid #ccdcd3!important;border-radius:9px!important;min-height:44px;font-size:14px;box-shadow:none!important;max-width:100%}
 body.cm-visual :is(input,textarea)::placeholder{color:#728783!important;opacity:1}
 body.cm-visual :is(input[type=checkbox],input[type=radio]){accent-color:var(--visual-green)!important;min-width:17px;min-height:17px;cursor:pointer}
 body.cm-visual input[type=color]{background:#fff!important;border:1px solid #ccdcd3!important;border-radius:8px;padding:4px}
 body.cm-visual :is(button,.btn,.photo-button,.photo):not(.tab-btn):not(.visual-icon-button){border-radius:9px!important;box-shadow:none!important;text-shadow:none!important;transition:background .14s,border-color .14s,box-shadow .14s;transform:none!important;font-weight:600;letter-spacing:0!important;line-height:1.4}
 body.cm-visual .btn{min-height:42px;height:auto!important;white-space:normal;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 15px!important;font-size:13px}
 body.cm-visual :is(.btn-secondary,.btn-outline){background:#fff!important;color:var(--visual-ink)!important;border:1px solid #d7deee!important}
 body.cm-visual :is(.btn-primary,.btn-success,button.primary,.btn-info){background:var(--visual-green)!important;color:#fff!important;border:1px solid var(--visual-green)!important}
 body.cm-visual :is(.btn-danger,button.danger){background:#fff0f1!important;color:#a52c38!important;border:1px solid #efc0c6!important}
 body.cm-visual .btn-warning{color:#825209!important;background:#fff6e1!important;border:1px solid #eed9a3!important}
 body.cm-visual :is(.btn,button.primary):not(:disabled):hover{filter:brightness(.96)}
 body.cm-visual :is(button,.btn):disabled{opacity:.48!important;cursor:not-allowed!important;filter:none}
 body.cm-visual :is(h1,h2,h3,h4,h5){font-family:var(--font-heading);text-shadow:none!important;letter-spacing:-.025em}
 body.cm-visual :is(summary){font-size:14px;font-weight:650;color:var(--visual-ink);min-height:44px;padding:11px 0;cursor:pointer}
 body.cm-visual details>summary::marker{color:var(--visual-green)}
 .visual-brand-mark{width:38px;height:38px;border-radius:12px;background:#5b4df5;display:grid;place-items:center;color:#fff;flex:none}
 .visual-brand-mark svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
 .visual-kicker{font-size:11px;letter-spacing:.14em!important;text-transform:uppercase;font-weight:750;color:var(--visual-green)}
 .visual-skip{position:fixed;top:-100px;left:16px;z-index:200000;background:#263759;color:#fff;padding:12px 18px;border-radius:8px}
 .visual-skip:focus{top:12px}
 .visual-password-wrap{position:relative;display:flex;gap:8px;align-items:center}
 .visual-password-wrap input{min-width:0;flex:1}
 .visual-password-toggle{flex:none;min-height:44px;padding:8px 12px!important;border:1px solid #d7deee!important;background:#f4f6fc!important;color:#465b7a!important;font-size:12px!important}
 .visual-footer{background:#fff!important;color:#75829b!important;border-top:1px solid #dfe4f2!important;box-shadow:none!important;font-size:12px!important}
 .visual-footer strong{color:#5b4df5!important}
 body.cm-visual :is(.modal-content,.modal-card,.partilha-card,.consent-reset-card,#password-prova-modal form,#reader-password-modal form){background:#fff!important;color:#263759!important;border:1px solid #dfe4f2!important;border-radius:18px!important;box-shadow:0 24px 80px #102d3440!important;max-height:90dvh;overflow:auto}
 body.cm-visual :is(.modal-overlay,.partilha-modal,.consent-reset-modal,#password-prova-modal,#reader-password-modal){background:#102d347a!important;backdrop-filter:blur(5px)}
 body.cm-visual :is(.modal-header-hero,.modal-card-header,.modal-card-footer){background:#f6f7fc!important;border-color:#dfe4f2!important;color:#263759!important}
 body.cm-visual :is(.modal-header-hero h2,.modal-card h3,.modal-title){color:#263759!important}
 body.cm-visual :is(.modal-header-hero p,.modal-subtitle){color:#75829b!important}
 @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}body.cm-visual *{transition:none!important}}
}

 body.visual-reader #capture-preview{border:1px solid #dfe4f2;border-radius:9px;max-width:100%}

 @media(max-width:600px){body.visual-reader>main{padding:20px 14px 70px!important}body.visual-reader main>header h1{font-size:22px!important}body.visual-reader main>header{gap:10px;margin-bottom:18px;padding-bottom:18px}body.visual-reader .panel{padding:18px!important;border-radius:14px!important;margin-bottom:14px!important}.visual-reader-home{font-size:11px}.visual-reader-login{margin-top:20px!important}body.visual-reader #password-panel:not([hidden]){margin-top:30px!important;padding:24px!important}body.visual-reader .visual-reader-camera .hint{font-size:11px}body.visual-reader #camera{min-height:240px!important}.visual-consentimentos #class-missing-panel{border-left:3px solid #5b4df5!important}body.visual-fita #fita-cartao{padding:24px!important}}

/* Identidade "Corta-Mato" nos leitores (dorsais, autorizações e fitas): a mesma da gestão. Base clara para ler ao sol. */

 body.cmp.visual-reader.visual-v2{
  --c-bg:#f3f5f8;--c-soft:#f6f8fb;--c-line:#e2e7ee;--c-line-2:#c9d2de;--c-ink:#0f1c2e;--c-text:#34405a;--c-muted:#5d6a80;
  --c-green:#0f7a43;--c-green-dk:#0a5a31;--c-green-wash:#e5f4eb;--c-green-mid:#a7d8b8;--c-sun:#ffc21a;--c-sun-wash:#fff6d6;--c-sun-ink:#5c4400;
  --c-red:#c2362b;--c-red-wash:#fdf0ee;--c-red-txt:#c2362b;--c-card:#fff;--c-chrome:#0f1c2e;--c-sun-line:#f0d27a;--c-red-line:#f1c2bc;

  color-scheme:light;background:var(--c-bg)!important;background-image:none!important;color:var(--c-text)!important;font-family:var(--f-body)!important;font-size:16px;
  padding-bottom:calc(var(--h-credit) + env(safe-area-inset-bottom,0px))!important;
 }
 body.cmp.visual-reader.visual-v2{--tone:#c93a1f;--tone-2:#d33f1c;--tone-dk:#9e2c16;--tone-wash:#fdece8;--tone-txt:#9e2c16}
 body.cmp.visual-reader.visual-v2.visual-consentimentos{--tone:#6a3fd0;--tone-2:#8456e6;--tone-dk:#5030a3;--tone-wash:#f0ebfc;--tone-txt:#5030a3}
 html:has(body.cmp){background:#f3f5f8!important}

 body.cmp.visual-reader.visual-v2 .visual-reader-step-icon{display:none!important}

 body.cmp.visual-reader.visual-v2 :is(.hint,.status,#fita-pendentes,#fita-ligacao,.queue-summary){color:var(--c-muted)!important;font-size:15px!important;line-height:1.6!important}
 body.cmp.visual-reader.visual-v2 :is(input,select,textarea):not([type=checkbox]):not([type=radio]):not([type=file]){background:var(--c-card)!important;color:var(--c-ink)!important;border:1.5px solid var(--c-line-2)!important;border-radius:12px!important;min-height:50px!important;font-size:16px!important;box-shadow:none!important}
 body.cmp.visual-reader.visual-v2 :is(input,select,textarea):not([type=checkbox]):not([type=radio]):focus{border-color:var(--tone)!important;box-shadow:0 0 0 4px var(--tone-wash)!important;outline:none}

 body.cmp.visual-reader.visual-v2 :is(button.primary,.primary,button[type=submit]):not(:disabled):hover{background:var(--tone-dk)!important;border-color:var(--tone-dk)!important}

 body.cmp.visual-reader.visual-v2 :is(.photo-button,.photo){display:flex!important;align-items:center;justify-content:center;gap:8px;margin-top:10px!important;border-style:dashed!important;color:var(--c-text)!important}
 body.cmp.visual-reader.visual-v2 .reader-withdraw-toggle{background:var(--c-sun-wash)!important;border:1px solid var(--c-sun-line)!important;color:var(--c-sun-ink)!important;border-radius:14px!important;padding:12px 14px!important}

  for(const [key,num]of Object.entries(states)){const e=$('[data-race-summary="'+key+'"]');if(e&&e.textContent!==String(num))e.textContent=String(num);}
  const total=configs.length,finished=states.finished,progress=$('#visual-race-progress');if(progress){progress.max=total||1;progress.value=finished;progress.setAttribute('aria-label',finished+' de '+total+' escalões terminados');}
  const label=$('#visual-race-summary');if(label)label.textContent=total?finished+' de '+total+' escalões terminados':'Os escalões aparecem quando houver atletas inscritos.';
  const controls=$('#visual-primary-overview');if(controls)decorate(controls);
 }
 function gestao(){
  all('.tab-btn').forEach(b=>{const key=b.id.replace('btn-tab-',''),slot=$('.visual-step-number',b);if(slot){slot.replaceChildren(icon(stageIcons[key]));slot.classList.add('visual-nav-symbol');}});
  const sidebar=$('.visual-sidebar'),mobile=make('div','visual-mobile-navigation'),label=make('label','','Etapa da prova'),select=make('select');select.id='visual-stage-select';label.htmlFor=select.id;
  all('.tab-btn').forEach(b=>{const option=make('option','',($('.visual-step-label',b)?.firstChild?.textContent||b.textContent).trim());option.value=b.getAttribute('aria-controls');select.append(option);});
  select.addEventListener('change',()=>{const b=$('#btn-'+select.value);if(b&&!b.disabled)window.mostrarTab(select.value,b);});mobile.append(label,select);sidebar.prepend(mobile);
  for(const head of all('.visual-section-heading')){const key=head.parentElement.id.replace('tab-',''),badge=make('div','visual-section-symbol');badge.append(icon(stageIcons[key]));head.prepend(badge);}
  all('.visual-overview-stat').forEach((n,i)=>{const badge=make('div','visual-stat-symbol');badge.append(icon(['users','document','flag','timer'][i]));n.prepend(badge);n.dataset.tone=['indigo','teal','blue','amber'][i];});
  all('.kpi-card').forEach((n,i)=>{const badge=make('div','visual-stat-symbol');badge.append(icon(['users','qr','users','users','flag','document','users'][i%7]));n.prepend(badge);});
  // O nome da prova aparece uma única vez, no seletor persistente.
  const header=$('.app-header'),field=make('div','visual-proof-field'),name=make('label','','Prova selecionada');name.htmlFor='provas-dropdown';field.append(name,$('#provas-dropdown'));
  const metadata=$('.event-info-subtitle');if(metadata)field.append(metadata);const actions=make('div','visual-proof-actions'),newProof=$('.prova-selector>button'),menu=$('.visual-event-menu');if(newProof)actions.append(newProof);if(menu)actions.append(menu);header.replaceChildren(field,actions);
  topButton($('.backup-controls>a'),'Quadro ao vivo');topButton($('#btn-partilhar-resultados'),'Partilhar resultados');topButton($('#btn-eliminar-partilha'),'Eliminar link externo');
  const account=$('.backup-controls>.visual-tools-menu>summary');if(account){account.title='Conta e opções';account.dataset.visualIcon='more';}
  // Substitui os cinco cartões de navegação repetidos por um resumo de preparação.
  const overview=$('#tab-provas'),journey=$('.visual-journey',overview);if(journey)journey.remove();const board=make('div','visual-overview-board'),prep=make('section','visual-prep-card');prep.append(make('h2','','Preparação da atividade'),make('p','visual-card-intro','Confirme os elementos essenciais antes da partida.'));
  const checklist=make('ul','visual-prep-list');for(const [key,title,kind]of [['prova','Definições da prova','settings'],['atletas','Inscrições e dorsais','users'],['autorizacoes','Consentimentos','document']]){const row=make('li');row.dataset.prep=key;const badge=make('div','visual-prep-icon');badge.append(icon(kind));const text=make('div');text.append(make('strong','',title),make('small','','Por preparar'));row.append(badge,text,make('span','visual-prep-state','Por preparar'));checklist.append(row);}prep.append(checklist);
  const primary=$('#visual-primary-overview');if(primary)prep.append(primary);const oldbar=$('.visual-actionbar',overview);if(oldbar)oldbar.remove();
  const race=make('section','visual-race-summary-card');race.append(make('h2','','Estado das corridas'),make('p','visual-card-intro','Evolução dos escalões com atletas inscritos.'));
  const nums=make('div','visual-race-summary-numbers');for(const [key,text]of [['waiting','Por iniciar'],['running','Em pista'],['finished','Terminados']]){const item=make('div'),n=make('strong','','0');n.dataset.raceSummary=key;item.dataset.state=key;item.append(n,make('span','',text));nums.append(item);}race.append(nums);const progress=make('progress');progress.id='visual-race-progress';race.append(progress);const status=make('p','visual-race-progress-label');status.id='visual-race-summary';race.append(status);
  const button=make('button','btn btn-secondary','Abrir cronometragem');button.type='button';button.dataset.visualIcon='timer';button.addEventListener('click',()=>{const b=$('#btn-tab-cronometragem');if(!b.disabled)window.mostrarTab('tab-cronometragem',b);});race.append(button);board.append(prep,race);const stats=$('.visual-overview-stats',overview);stats.after(board);
  all('.visual-fold').forEach(d=>{const summary=$(':scope>summary',d),text=summary.firstChild?.textContent||'';d.dataset.category=/CSV/.test(text)?'import':/manualmente/.test(text)?'pupil':/Numeração/.test(text)?'number':/certificad/.test(text)?'certificate':/consentimento/.test(text)?'consent':'design';summary.dataset.visualIcon=/CSV/.test(text)?'upload':/manualmente/.test(text)?'plus':/Numeração/.test(text)?'sort':/Logótipos/.test(text)?'image':'palette';});
  const filters=$('#preview-section>div:first-child>div');if(filters)filters.classList.add('visual-filter-bar');
  for(const node of all('.box>h3,.box>div>h3'))if(!node.closest('#print-area')){const text=node.textContent.toLowerCase();node.dataset.sectionIcon=/partida|cronom/.test(text)?'timer':/inscrit|participante/.test(text)?'users':/certificado/.test(text)?'award':/password/.test(text)?'lock':/document|consent/.test(text)?'document':/meta/.test(text)?'flag':null;if(node.dataset.sectionIcon&&node.dataset.sectionIcon!=='null')node.prepend(icon(node.dataset.sectionIcon));}
  for(const fn of ['mostrarTab','selecionarProva','aplicarEstadoRemoto','atualizarTabelaParticipantes','atualizarDisplayArranque','verificarTabs'])if(typeof window[fn]==='function'){const previous=window[fn];window[fn]=function(...args){const result=previous.apply(this,args);schedule();return result;};}
  update();
 }
 function readers(){
  const panelIcon=document.body.classList.contains('visual-dorsais')?'qr':document.body.classList.contains('visual-consentimentos')?'document':'flag';
  const mark=$('main>header>.visual-brand-mark');if(mark)mark.replaceChildren(icon(panelIcon));
  all('.visual-reader-step').forEach(n=>{const number=n.dataset.step;n.dataset.originalStep=number;const badge=make('span','visual-reader-step-icon');badge.append(icon(/turma|prova|acesso/i.test(n.textContent)?'users':/ler/i.test(n.textContent)?'camera':/registo/i.test(n.textContent)?'edit':'check'));n.prepend(badge);});
  const camera=$('#camera');if(camera){const corner=make('span','visual-camera-guide');corner.setAttribute('aria-hidden','true');camera.append(corner);}
 }
 let initialized=false;
 function iniciar(){if(initialized)return;initialized=true;
  if(document.body.classList.contains('visual-gestao'))gestao();else if(document.body.classList.contains('visual-reader'))readers();
  decorateAll();
  new MutationObserver(records=>{const nodes=new Set();for(const r of records){if(r.target.parentElement?.closest(ignored))continue;if(r.target.nodeType===1){const b=r.target.closest('button,.btn,summary');if(b)nodes.add(b);}for(const n of r.addedNodes)if(n.nodeType===1&&!n.closest(ignored))nodes.add(n);}
   for(const n of nodes)decorateAll(n);
  }).observe(document.body,{childList:true,subtree:true});
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',iniciar);else iniciar();
 return {iniciar,atualizar:schedule};
})();

<script id="cm-percurso-leitor-ui">
/* Percurso de bolas dos leitores: mostra os passos, o passo atual e os já feitos. Só apresentação. */
window.CMPercursoLeitor=(()=>{
 const $=(s,r=document)=>r.querySelector(s),all=(s,r=document)=>[...r.querySelectorAll(s)];
 function make(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}
 const SVG={flag:'M5 21V3m0 1c5-4 9 4 15 0v10c-6 4-10-4-15 0',check:'M5 12l4 4L19 6'};
 function ico(n){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('class','cmp-ico');s.setAttribute('aria-hidden','true');s.setAttribute('focusable','false');const p=document.createElementNS(s.namespaceURI,'path');p.setAttribute('d',SVG[n]);s.append(p);return s;}
 const visivel=n=>!!n&&n.getClientRects().length>0;
 let itens=[],pendente=false;
 function agendar(){if(pendente)return;pendente=true;setTimeout(()=>{pendente=false;atualizar();},60);}
 function atualizar(){
  const vis=itens.map(it=>visivel(it.painel));
  let atual=-1;const linha=innerHeight*.45;
  itens.forEach((it,i)=>{if(vis[i]&&(atual<0||it.painel.getBoundingClientRect().top<linha))atual=i;});
  // No topo da página, o passo atual é o primeiro por fazer: um ecrã alto mostra vários passos ao mesmo tempo.
  if(scrollY<8){const falta=itens.findIndex((it,i)=>vis[i]&&!(it.feito?.()??false));if(falta>=0)atual=falta;}
  // No fim da página, o último passo visível é o atual, mesmo que o título não chegue a meio do ecrã.
  else if(scrollY+innerHeight>=document.documentElement.scrollHeight-4){vis.forEach((v,i)=>{if(v)atual=i;});}
  itens.forEach((it,i)=>{
   // Um passo com condição só fica feito quando ela se cumpre, e os seguintes não contam como feitos antes disso.
   const depois=vis.some((v,j)=>v&&j>i),bloqueado=itens.some((o,j)=>j<i&&vis[j]&&o.feito&&!o.feito()),feito=i!==atual&&!bloqueado&&(it.feito?it.feito():((vis[i]&&i<atual)||(!vis[i]&&depois)));
   it.b.disabled=!vis[i];it.li.classList.toggle('is-done',feito);
   if(i===atual)it.b.setAttribute('aria-current','step');else it.b.removeAttribute('aria-current');
   const sig=String(feito);if(it.ponto.dataset.sig!==sig){it.ponto.dataset.sig=sig;it.ponto.replaceChildren(feito?ico('check'):document.createTextNode(String(i+1)));}
   it.b.setAttribute('aria-label','Passo '+(i+1)+': '+it.nome+(feito?' (feito)':''));
  });
 }
 let iniciado=false;
 function iniciar(){
  if(iniciado||!document.body.classList.contains('cmp'))return;iniciado=true;
  const ano=$('#credit-year');if(ano)ano.textContent=String(new Date().getFullYear());
  const header=$('main>header');if(header&&!$(':scope>.cmp-mark',header)){const m=make('span','cmp-mark');m.append(ico('flag'));header.prepend(m);}
  const casa=$('.visual-reader-home');if(casa){casa.href='index.html';casa.textContent='Gestão ↗';}
  if(header&&window.CMTema){const ref=[...header.children].find(n=>n.matches('a,button'));CMTema.botao(header,'cm-tema-btn',ref);}
  if(document.body.classList.contains('visual-consentimentos')){const h=$('main>header h1');if(h)h.textContent='Leitor de autorizações';}
  // O leitor de consentimentos começa pela password: entra no percurso como primeiro passo.
  const acesso=$('#password-panel');if(acesso&&!$('.visual-reader-step',acesso)){const s=make('div','visual-reader-step','Entrar no leitor');acesso.prepend(s);}
  const passos=all('.visual-reader-step');if(!header||!passos.length)return;
  const nav=make('nav','cmp-percurso');nav.setAttribute('aria-label','Passos do leitor');const ol=make('ol');
  itens=passos.map((p,i)=>{
   p.dataset.step=String(i+1);
   const nome=p.textContent.trim(),painel=p.closest('.panel,form,section,article')||p.parentElement;
   const curto={'Entrar no leitor':'Entrar','Selecionar a turma':'Turma','Ler as respostas':'Ler','Acompanhar as faltas':'Faltas','Escolher a prova':'Prova','Ler os dorsais':'Ler','Registo manual':'Manual','Confirmar os registos':'Registos','Acesso à prova':'Acesso','Conferir e validar':'Validar'}[nome]||nome;
   const li=make('li'),b=make('button'),ponto=make('span','cmp-ponto',String(i+1));b.type='button';b.append(ponto,make('span','cmp-rot',curto));
   b.addEventListener('click',()=>painel.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'}));
   li.append(b);ol.append(li);
   const it={li,b,ponto,painel,nome};
   if(painel.contains($('#proof')))it.feito=()=>{try{return !!selectedId;}catch(e){return !!$('#proof')?.value;}};
   return it;
  });
  nav.append(ol);header.after(nav);
  addEventListener('scroll',agendar,{passive:true});addEventListener('resize',agendar);document.addEventListener('change',agendar);
  new MutationObserver(agendar).observe(document.body,{subtree:true,attributes:true,attributeFilter:['hidden','style']});
  atualizar();
 }
 // Leitor de dorsais: o tempo usa a hora do telemóvel, por isso avisa quando não bate certo com a partida.
 function vigiarRelogio(){
  if(!$('#read-mode'))return;
  window.CMRelogio?.verificar();
  const vistos=new Map();let primeira=true;
  setInterval(()=>{
   try{
    const p=(state?.provas||[]).find(x=>x.id===selectedId);if(!p)return;
    for(const [k,c] of Object.entries(p.escaloesConfig||{})){
     const h=Number(c.horaArranqueMs)||0;if(!h||vistos.get(k)===h)continue;
     vistos.set(k,h);if(primeira)continue;
     const dif=Date.now()-h;
     if(dif<-3000||dif>20000)window.CMRelogio?.avisar(Math.round(dif/1000));
    }
    primeira=false;
   }catch(e){}
  },2000);
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',vigiarRelogio);else vigiarRelogio();
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',iniciar);else iniciar();
 return {iniciar,atualizar:agendar};
})();
